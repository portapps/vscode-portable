name: update-app

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches:
      - 'master'
  pull_request:
    paths:
      - '.github/workflows/update-app.yml'
      - 'build.properties'

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    environment: update-app # secrets are gated by this environment
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      -
        name: GitHub auth token from GitHub App
        id: write-app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTAPPS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PORTAPPS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.write-app.outputs.token }}
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update VS Code
        id: update
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: &update-script |
            const fs = require('fs');
            const path = require('path');

            const metadataUrl = 'https://update.code.visualstudio.com/api/update/win32-x64-archive/stable/latest';
            const response = await fetch(metadataUrl);
            if (!response.ok) {
              throw new Error(`VS Code update API returned HTTP ${response.status}`);
            }
            const metadata = await response.json();
            const latestVersion = metadata.name;
            if (typeof latestVersion !== 'string' || !/^\d+\.\d+\.\d+$/.test(latestVersion)) {
              throw new Error(`Invalid stable VS Code version: ${latestVersion}`);
            }

            const propertiesPath = path.join(process.env.GITHUB_WORKSPACE, 'build.properties');
            const properties = fs.readFileSync(propertiesPath, 'utf8');
            const versionMatch = properties.match(/^app\.version[ \t]*=[ \t]*(\d+\.\d+\.\d+)[ \t]*(?=\r?$)/m);
            const releaseMatch = properties.match(/^app\.release[ \t]*=[ \t]*(\d+)[ \t]*(?=\r?$)/m);
            if (!versionMatch || !releaseMatch) {
              throw new Error('Missing or invalid app.version or app.release in build.properties');
            }

            const currentVersion = versionMatch[1];
            const compareVersions = (left, right) => {
              const leftParts = left.split('.').map(Number);
              const rightParts = right.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if (leftParts[i] !== rightParts[i]) {
                  return leftParts[i] - rightParts[i];
                }
              }
              return 0;
            };

            if (compareVersions(latestVersion, currentVersion) > 0) {
              const nextRelease = Number(releaseMatch[1]) + 1;
              if (!Number.isSafeInteger(nextRelease)) {
                throw new Error(`Invalid next app.release: ${nextRelease}`);
              }
              const updated = properties
                .replace(versionMatch[0], `app.version = ${latestVersion}`)
                .replace(releaseMatch[0], `app.release = ${nextRelease}`);
              fs.writeFileSync(propertiesPath, updated, 'utf8');
              core.info(`Updated VS Code from ${currentVersion} to ${latestVersion}, release ${nextRelease}`);
            } else {
              core.info(`VS Code ${currentVersion} is already current`);
            }

            core.setOutput('title', `VS Code ${latestVersion}`);
            core.setOutput('version', latestVersion);
      -
        name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: update-vscode
          token: ${{ steps.write-app.outputs.token }}
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          signoff: true
          sign-commits: true
          delete-branch: true
          body: |
            This updates VS Code to ${{ steps.update.outputs.version }}.

  diff:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      -
        name: Update VS Code
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: *update-script
      -
        name: Show diff
        shell: pwsh
        run: |
          $diff = git --no-pager diff -- build.properties
          if ($diff) {
            $diff
          } else {
            Write-Host "No update diff."
          }
